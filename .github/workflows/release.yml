# Publishing a GitHub release (tag v<version>, e.g. v0.4-alpha) builds the mod from this exact source
# and attaches the jar to that release. No files are uploaded by hand.
name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install MinGW-w64
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # llvm-mingw from GitHub (Ubuntu's mirrors are sometimes unreachable from the runners); apt as fallback
          url=$(gh api repos/mstorsjo/llvm-mingw/releases/latest \
            --jq '.assets[] | select(.name | test("ucrt-ubuntu-22.04-x86_64.tar.xz$")) | .browser_download_url' | head -1)
          if [ -n "$url" ] && curl -fsSL --retry 3 "$url" -o /tmp/llvm-mingw.tar.xz; then
            mkdir -p /tmp/llvm-mingw && tar -xJf /tmp/llvm-mingw.tar.xz -C /tmp/llvm-mingw --strip-components=1
            echo "/tmp/llvm-mingw/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends g++-mingw-w64-x86-64
      - name: Build audio helper from native/mmaudio.cpp
        run: ./scripts/build-audio-helper.sh
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Find jar
        id: jar
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then echo "Tag $GITHUB_REF_NAME does not match version=$version"; exit 1; fi
          jar="build/libs/SharingCraft-$version.jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          sha256sum "$jar" src/client/resources/multimedia/mmaudio.exe
      - name: Attach jar to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.jar.outputs.jar }}" --clobber
