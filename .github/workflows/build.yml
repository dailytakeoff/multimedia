# Builds the mod on every push: audio helper from source, then the jar.
name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install MinGW-w64
        timeout-minutes: 12
        run: |
          # Ubuntu's mirrors sometimes hang: give each try 3 minutes and retry
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends g++-mingw-w64-x86-64; then
              exit 0
            fi
            echo "try $i failed, retrying"; sleep 10
          done
          exit 1
      - name: Build audio helper from native/mmaudio.cpp
        run: ./scripts/build-audio-helper.sh
      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Report compile errors as annotations
        if: failure()
        run: |
          # each error with the 3 lines after it (symbol/location), all in one annotation (newlines as %0A)
          grep -E -A3 '(error:|e: |FAILURE|What went wrong)' build.log | head -400 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:0:60000}"
      - name: Checksums
        run: sha256sum build/libs/*.jar src/client/resources/multimedia/mmaudio.exe
      - name: Save jar to the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/streamfree'
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- -sources.jar | head -1)
          mkdir -p /tmp/out && cp "$jar" /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - uses: actions/upload-artifact@v4
        with:
          name: multimedia
          path: build/libs/*.jar
